name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release
      - name: Tests
        run: cargo test --release
      - name: Smoke test
        run: .\target\release\obhod.exe --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: obhod-windows-x64
          path: target/release/obhod.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/obhod.exe
          generate_release_notes: true